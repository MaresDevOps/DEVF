<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación con Zod</title>
  <!-- Importando Zod vía CDN -->
  <script src="https://cdn.jsdelivr.net/npm/zod@3.22.4/lib/index.umd.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 20px; }
    form { background: #fff; padding: 25px; border-radius: 8px; max-width: 400px; margin: 30px auto 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #1f2937; }
    label { display: block; margin-top: 15px; font-weight: bold; color: #374151; }
    input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 4px; }
    button { width: 100%; margin-top: 20px; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    
    .messages-container { max-width: 400px; margin: 20px auto; }
    .error-box { color: #b91c1c; background: #fee2e2; padding: 10px; border-radius: 5px; font-size: 14px; border: 1px solid #f87171; display: none; }
    .error-box ul { margin: 0; padding-left: 20px; }
    .success { color: #16a34a; background: #dcfce7; padding: 15px; border-radius: 5px; font-weight: bold; text-align: center; display: none; border: 1px solid #86efac; }
  </style>
</head>
<body>
  <h1>Registro de Usuario</h1>
  <form id="registerForm">
    <!-- Le quitamos el atributo "required" a los inputs para que HTML no los valide por defecto
         y podamos probar que Zod haga todo el trabajo -->
    <label for="name">Nombre:</label>
    <input type="text" id="name" placeholder="Tu nombre" />

    <label for="email">Correo Electrónico:</label>
    <input type="email" id="email" placeholder="Tu correo" />

    <label for="password">Contraseña:</label>
    <input type="password" id="password" placeholder="Contraseña" />

    <button type="submit">Registrar</button>
  </form>

  <div class="messages-container">
      <div id="errors" class="error-box">
          <strong>Se encontraron errores:</strong>
          <ul id="errors-list"></ul>
      </div>
      <p id="success-msg" class="success">¡Registro exitoso!</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
