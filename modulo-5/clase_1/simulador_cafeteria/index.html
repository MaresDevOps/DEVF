<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Cafetería</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: #f4f4f9;
        }
        h1 { color: #333; }
        button {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #orderList { 
            list-style-type: none; 
            padding: 0; 
            max-width: 400px;
        }
        li { 
            padding: 10px; 
            background-color: white;
            border: 1px solid #ccc; 
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .en-proceso { color: #d97706; font-weight: bold; }
        .completado { color: #16a34a; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Cafetería: Simulador de Pedidos</h1>
    <button id="addOrderBtn">Agregar Pedido</button>
    
    <h2>Pedidos:</h2>
    <ul id="orderList"></ul>

    <script src="app.js"></script>
</body>
</html>
